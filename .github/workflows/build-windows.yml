name: Build Windows

on:
  workflow_call:
    inputs:
      version:
        description: "WSJT-X version string"
        required: true
        type: string
      hamlib_branch:
        description: "Hamlib branch to build"
        required: false
        type: string
        default: "4.7.0"
      arch:
        description: "Windows target architecture: x86_64 or x86"
        required: false
        type: string
        default: "x86_64"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    # Arch-dependent values used throughout the job. MINGW_DIR is the
    # MSYS2 subtree ("/mingw64" or "/mingw32") that setup-msys2 populates;
    # PKG is the MSYS2 package prefix; NSIS_SUFFIX is the installer
    # filename suffix that matches the upstream v3.0.0 release naming
    # (wsjtx-<ver>-win64.exe / wsjtx-<ver>-win32.exe).
    env:
      MINGW_DIR: ${{ inputs.arch == 'x86' && 'mingw32' || 'mingw64' }}
      PKG: ${{ inputs.arch == 'x86' && 'mingw-w64-i686' || 'mingw-w64-x86_64' }}
      NSIS_SUFFIX: ${{ inputs.arch == 'x86' && 'win32' || 'win64' }}
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ inputs.arch == 'x86' && 'MINGW32' || 'MINGW64' }}
          update: true
          cache: true
          # MSYS2 removed mingw-w64-i686 Qt5, FFTW, and libusb from its
          # i686 repo in late 2024. They're still hosted as files on
          # repo.msys2.org/mingw/mingw32/ — just de-indexed from the
          # pacman database. For x86 we omit them from the install list
          # here and pull them directly in the next step.
          install: >-
            git make tar
            ${{ env.PKG }}-gcc
            ${{ env.PKG }}-gcc-fortran
            ${{ env.PKG }}-cmake
            ${{ env.PKG }}-boost
            ${{ env.PKG }}-portaudio
            ${{ env.PKG }}-pkg-config
            ${{ env.PKG }}-nsis
            ${{ env.PKG }}-osslsigncode
            autoconf automake libtool
            ${{ inputs.arch != 'x86' && format('{0}-qt5-base {0}-qt5-multimedia {0}-qt5-serialport {0}-qt5-tools {0}-qt5-websockets {0}-qt5-activeqt {0}-fftw {0}-libusb', env.PKG) || '' }}

      # ── x86-only: pull the i686 Qt5 / FFTW / libusb packages from
      # MSYS2's archive CDN ──────────────────────────────────────────
      # MSYS2 delisted these from the i686 pacman database in late
      # 2024 but the .pkg.tar.zst files remain hosted at
      # repo.msys2.org. Versions pinned to the last release present
      # in the archive (verified via directory index before commit).
      # qt5-serialport and qt5-websockets both cap at 5.15.14; Qt5
      # patch-level ABI compatibility lets us use 5.15.14 across all
      # components. pacman -U installs local .pkg.tar.zst files
      # directly. --overwrite '*' tolerates files the base install
      # may have already laid down.
      - name: Install archived i686 Qt5/FFTW/libusb (x86 only)
        if: inputs.arch == 'x86'
        run: |
          set -euo pipefail
          MIRROR="https://repo.msys2.org/mingw/mingw32"
          PKGS=(
            "mingw-w64-i686-qt5-base-5.15.14%2Bkde%2Br143-1-any.pkg.tar.zst"
            "mingw-w64-i686-qt5-multimedia-5.15.14-1-any.pkg.tar.zst"
            "mingw-w64-i686-qt5-serialport-5.15.14-1-any.pkg.tar.zst"
            "mingw-w64-i686-qt5-tools-5.15.14-1-any.pkg.tar.zst"
            "mingw-w64-i686-qt5-websockets-5.15.14%2Bkde%2Br2-1-any.pkg.tar.zst"
            "mingw-w64-i686-qt5-activeqt-5.15.14-1-any.pkg.tar.zst"
            "mingw-w64-i686-fftw-3.3.10-5-any.pkg.tar.zst"
            "mingw-w64-i686-libusb-1.0.26-1-any.pkg.tar.zst"
          )
          mkdir -p /tmp/archived-pkgs
          cd /tmp/archived-pkgs
          for pkg in "${PKGS[@]}"; do
            # curl downloads to a file named with %2B preserved — rename
            # to the decoded form so pacman sees a canonical local name.
            local_name="${pkg//%2B/+}"
            echo "Fetching ${local_name}…"
            curl -fsSL -o "${local_name}" "${MIRROR}/${pkg}"
          done
          ls -lh
          pacman -U --noconfirm --overwrite='*' ./*.pkg.tar.zst

      - name: Cache pFUnit
        id: pfunit-cache
        uses: actions/cache@v5
        with:
          path: pfunit-prefix
          key: pfunit-windows-${{ inputs.arch }}-v4.9.0-${{ hashFiles('.github/workflows/build-windows.yml') }}

      - name: Build pFUnit
        if: steps.pfunit-cache.outputs.cache-hit != 'true'
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          git config --global core.longpaths true
          git clone --depth 1 --branch v4.9.0 --recursive \
            https://github.com/Goddard-Fortran-Ecosystem/pFUnit.git pfunit-src
          cmake -S pfunit-src -B pfunit-build -G "MSYS Makefiles" \
            -DSKIP_MPI=YES \
            -DSKIP_OPENMP=YES \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="${WORKSPACE}/pfunit-prefix"
          cmake --build pfunit-build -j$(nproc)
          cmake --install pfunit-build

      - name: Locate pFUnit config
        id: pfunit
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          # Locate each sub-package's config directly — MSYS2 pkg-config
          # interacts badly with multi-entry CMAKE_PREFIX_PATH, so we pass
          # explicit <pkg>_DIR hints instead.
          for pkg in PFUNIT GFTL GFTL_SHARED FARGPARSE; do
            CONFIG=$(find "${WORKSPACE}/pfunit-prefix" -name ${pkg}Config.cmake | head -1)
            if [ -z "$CONFIG" ]; then
              echo "ERROR: ${pkg}Config.cmake not found under pfunit-prefix"
              find "${WORKSPACE}/pfunit-prefix" -maxdepth 3 -type d
              exit 1
            fi
            DIR="$(dirname "$CONFIG")"
            echo "Found ${pkg}Config.cmake at: $CONFIG"
            echo "$(echo $pkg | tr '[:upper:]' '[:lower:]')_dir=${DIR}" >> "$GITHUB_OUTPUT"
          done

      - name: Cache Hamlib
        id: hamlib-cache
        uses: actions/cache@v5
        with:
          path: hamlib-prefix
          key: hamlib-windows-${{ inputs.arch }}-${{ inputs.hamlib_branch }}-${{ hashFiles('.github/workflows/build-windows.yml') }}

      - name: Build Hamlib
        if: steps.hamlib-cache.outputs.cache-hit != 'true'
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          git clone --depth 1 --branch "${{ inputs.hamlib_branch }}" \
            https://github.com/Hamlib/Hamlib.git hamlib-src
          cd hamlib-src
          ./bootstrap
          ./configure \
            --prefix="${WORKSPACE}/hamlib-prefix" \
            --enable-shared --disable-static \
            --without-cxx-binding \
            --without-readline \
            CFLAGS="-DNDEBUG -g -O2 -fdata-sections -ffunction-sections" \
            LDFLAGS="-Wl,--gc-sections"
          make -j$(nproc)
          make install-strip

      - name: Install OmniRig
        shell: pwsh
        run: |
          # Download OmniRig (provides type library embedded in OmniRig.exe for dumpcpp)
          Invoke-WebRequest -Uri "https://www.dxatlas.com/OmniRig/Files/OmniRig.zip" -OutFile OmniRig.zip
          Expand-Archive -Path OmniRig.zip -DestinationPath omnirig-extract
          # Run the installer silently (InnoSetup)
          $setup = Get-ChildItem -Path omnirig-extract -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $setup) { throw "No installer found in OmniRig.zip" }
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/NORESTART' -Wait
          # Locate the installed OmniRig.exe (embeds the COM type library)
          $omnirig = Get-ChildItem -Path "C:\Program Files*\Afreet\OmniRig" -Filter "OmniRig.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $omnirig) { throw "OmniRig install failed — OmniRig.exe not found" }
          echo "OMNIRIG_PATH=$($omnirig.FullName)" >> $env:GITHUB_ENV

      - name: Fix dumpcpp name (MSYS2 ships dumpcpp-qt5, CMake expects dumpcpp)
        run: |
          ln -sf "/${MINGW_DIR}/bin/dumpcpp-qt5.exe" "/${MINGW_DIR}/bin/dumpcpp.exe"

      - name: Configure
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          OMNIRIG=$(cygpath "${OMNIRIG_PATH}")
          cmake -G "MSYS Makefiles" -S . -B wsjtx-build \
            -DCMAKE_PREFIX_PATH="${WORKSPACE}/hamlib-prefix" \
            -DOMNIRIG_TYPE_LIB="${OMNIRIG}" \
            -DWSJT_SKIP_MAP65=ON \
            -DCMAKE_Fortran_FLAGS="-fallow-argument-mismatch -std=legacy" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DWSJT_GENERATE_DOCS=OFF \
            -DWSJT_SKIP_MANPAGES=ON \
            -DWSJT_BUILD_TESTS=ON \
            -DPFUNIT_DIR="${{ steps.pfunit.outputs.pfunit_dir }}" \
            -DGFTL_DIR="${{ steps.pfunit.outputs.gftl_dir }}" \
            -DGFTL_SHARED_DIR="${{ steps.pfunit.outputs.gftl_shared_dir }}" \
            -DFARGPARSE_DIR="${{ steps.pfunit.outputs.fargparse_dir }}" \
            -Wno-dev

      - name: Build
        run: cmake --build wsjtx-build -j$(nproc)

      - name: Run tests
        id: ctest
        run: ctest --output-on-failure --output-junit ctest-results.xml
        working-directory: wsjtx-build

      - name: Publish test summary
        if: always() && steps.ctest.conclusion != 'skipped'
        working-directory: wsjtx-build
        run: python3 ../.github/scripts/publish-ctest-summary.py "Windows ${{ inputs.arch }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always() && steps.ctest.conclusion != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: ctest-results-windows-${{ inputs.arch }}
          path: wsjtx-build/ctest-results.xml
          if-no-files-found: ignore

      - name: Verify binary
        run: |
          file wsjtx-build/jt9.exe

      # Issue #23 — emit an NSIS installer containing the full CLI tool set
      # (wsjtx.exe, jt9, wsprd, fmtave, fcal, fmeasure + WSJT_BUILD_UTILS
      # ft8code/jt65code/... + rigctl wrappers + Qt runtime via bundle_fixup).
      # CMakeLists.txt:1989-1990 sets CPACK_GENERATOR=NSIS on WIN32 and
      # CPACK_MONOLITHIC_INSTALL=1 packages every install() target.
      - name: Package NSIS installer
        run: |
          cd wsjtx-build
          # Issue #35 — override CPACK_PACKAGE_VERSION and
          # CPACK_PACKAGE_FILE_NAME so the NSIS installer filename
          # matches the tag-derived version exactly, including any
          # pre-release suffix (-rc1, -beta1, etc.). CMakeLists.txt
          # VERSION is numeric-only (CMake won't accept suffixes), so
          # without this override cpack produces wsjtx-<numeric>-win64.exe
          # while the sign step and upload-artifact paths below expect
          # wsjtx-<inputs.version>-win64.exe. release.yml's prepare job
          # enforces numeric-base parity; this override covers the
          # suffix gap.
          cpack -G NSIS -V \
            -D CPACK_PACKAGE_VERSION="${{ inputs.version }}" \
            -D CPACK_PACKAGE_FILE_NAME="wsjtx-${{ inputs.version }}-${NSIS_SUFFIX}"
          ls -la *.exe

      # Issue #23 — self-signed sandbox signing. Proves the signing step is
      # wired into the pipeline; signature will NOT chain to a trusted root
      # (by design — production cert is team-owned per issue #23 "Signing
      # cert" section). Generates an ephemeral cert per-run.
      - name: Sign installer with self-signed sandbox cert
        run: |
          cd wsjtx-build
          INSTALLER=$(ls wsjtx-${{ inputs.version }}-*.exe | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "ERROR: no NSIS installer produced by cpack"
            ls -la
            exit 1
          fi
          echo "Unsigned installer: $INSTALLER"
          # MSYS2 auto-converts arguments starting with '/' into Windows paths
          # (e.g., '/CN=...' becomes 'D:/a/_temp/msys64/CN=...').
          # MSYS2_ARG_CONV_EXCL="*" disables that conversion for this command.
          MSYS2_ARG_CONV_EXCL="*" openssl req -x509 -newkey rsa:2048 \
            -keyout sandbox-key.pem -out sandbox-cert.pem \
            -days 365 -nodes \
            -subj "/CN=WSJT-X Sandbox Dev Signing/O=KJ5HST-LABS/C=US"
          SIGNED="${INSTALLER%.exe}-signed.exe"
          osslsigncode sign \
            -certs sandbox-cert.pem -key sandbox-key.pem \
            -n "WSJT-X Sandbox Installer" \
            -i "https://github.com/KJ5HST-LABS/wsjtx-internal" \
            -h sha256 \
            -in "$INSTALLER" -out "$SIGNED"
          mv "$SIGNED" "$INSTALLER"
          rm -f sandbox-key.pem sandbox-cert.pem
          echo "Signed installer: $INSTALLER"
          osslsigncode verify "$INSTALLER" || true
          # Exit 0: osslsigncode verify returns non-zero on CA-untrust even
          # when the signature itself is structurally valid. Sandbox cert is
          # self-signed by design; the "|| true" keeps CI green. Structural
          # presence is proven by the sign step succeeding above.

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: wsjtx-${{ inputs.version }}-windows-${{ inputs.arch }}-installer
          path: wsjtx-build/wsjtx-${{ inputs.version }}-${{ env.NSIS_SUFFIX }}.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wsjtx-${{ inputs.version }}-windows-${{ inputs.arch }}
          path: |
            wsjtx-build/jt9.exe
            wsjtx-build/wsprd.exe
            wsjtx-build/wsjtx.exe
