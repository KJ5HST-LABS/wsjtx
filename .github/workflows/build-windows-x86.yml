name: Build Windows x86

# 32-bit Windows build. Uses JTSDK 3.3.1-x86 (Qt 5.15.2 + MinGW 8.1 +
# fftw + libusb + boost + active-qt, all pre-built for i686) as the
# toolchain. MSYS2's own i686 repo dropped Qt5 packaging in late 2024
# and aqtinstall doesn't ship qtactiveqt for win32_mingw81, so JTSDK
# is the only viable path that preserves feature parity with the
# v3.0.0 shipped binary (including OmniRig COM support).
#
# All build steps after the JTSDK install run inside JTSDK's bundled
# MSYS2 bash (via --login). That sets PATH so /mingw32/bin is ahead
# of everything, matching how the JTSDK team builds locally.

on:
  workflow_call:
    inputs:
      version:
        description: "WSJT-X version string"
        required: true
        type: string
      hamlib_branch:
        description: "Hamlib branch to build"
        required: false
        type: string
        default: "4.7.0"

jobs:
  build:
    runs-on: windows-latest
    # MSYS2's /etc/profile uses MSYSTEM to decide which subsystem PATH
    # to configure. Without it the login shell falls back to plain MSYS
    # (just /usr/bin + /usr/local/bin), which leaves /mingw32/bin
    # invisible and strips gcc/cmake/qmake/etc. MSYS2_PATH_TYPE=inherit
    # keeps the Windows PATH (so tools like git from the runner stay
    # accessible).
    env:
      MSYSTEM: MINGW32
      MSYS2_PATH_TYPE: inherit
      CHERE_INVOKING: 1
    defaults:
      run:
        # JTSDK's bundled MSYS2 bash, --login reads /etc/profile which
        # puts /mingw32/bin on PATH. -e halts on first error;
        # -o pipefail propagates failures through pipes.
        shell: 'C:\JTSDK32-Tools\tools\msys64\usr\bin\bash.exe --login -e -o pipefail {0}'
    steps:
      # NOTE: the first two steps MUST use shell: pwsh because JTSDK's
      # bash isn't on disk until the installer has run.

      - name: Checkout
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git clone --no-checkout --depth 1 "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" .
          git fetch --depth 1 origin $env:GITHUB_SHA
          git checkout $env:GITHUB_SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache JTSDK installer
        id: jtsdk-dl-cache
        uses: actions/cache@v5
        with:
          path: C:\jtsdk-installer
          key: jtsdk-3.3.1-x86-installer

      - name: Download JTSDK 3.3.1-x86 installer
        if: steps.jtsdk-dl-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\jtsdk-installer | Out-Null
          # Use SourceForge's master.dl mirror directly — the downloads.sourceforge.net
          # front door serves an HTML redirect page that Invoke-WebRequest
          # saves as the "download" (145 KB instead of the expected 353 MB).
          $url = "https://master.dl.sourceforge.net/project/hamlib-sdk/Windows/JTSDK-3.3-x86-Stream/JTSDK-3.3.1-x86-EXPERIMENT.exe?viasf=1"
          $dest = "C:\jtsdk-installer\jtsdk.exe"
          Write-Host "Downloading JTSDK 3.3.1-x86 installer…"
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
          $size = (Get-Item $dest).Length
          Write-Host "Downloaded $size bytes to $dest"
          if ($size -lt 300000000) {
            throw "Installer size below expected ~353 MB — likely a redirect or 404"
          }

      - name: Install JTSDK 3.3.1-x86
        shell: pwsh
        run: |
          # Inno Setup silent install; /DIR pins the install location so
          # the bash shell path above resolves. /LOG captures the
          # installer's own log for diagnosis.
          $installer = "C:\jtsdk-installer\jtsdk.exe"
          $logFile = "C:\jtsdk-installer\install.log"
          Write-Host "Running silent install…"
          $p = Start-Process -FilePath $installer `
            -ArgumentList '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES', `
                          '/DIR=C:\JTSDK32-Tools', `
                          "/LOG=$logFile" `
            -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            if (Test-Path $logFile) {
              Write-Host "---- Installer log tail ----"
              Get-Content $logFile -Tail 80
            }
            throw "JTSDK install failed with exit $($p.ExitCode)"
          }
          # Sanity: verify the expected bash + mingw32 tree exists.
          $bash = 'C:\JTSDK32-Tools\tools\msys64\usr\bin\bash.exe'
          $mingw = 'C:\JTSDK32-Tools\tools\msys64\mingw32'
          if (-not (Test-Path $bash))  { throw "bash missing at $bash" }
          if (-not (Test-Path $mingw)) { throw "mingw32 tree missing at $mingw" }
          Write-Host "JTSDK install verified."

      - name: Probe JTSDK environment
        run: |
          echo "=== bash / compiler / Qt probe ==="
          echo "bash:   $(command -v bash)"
          echo "gcc:    $(command -v gcc) — $(gcc --version | head -1)"
          echo "g++:    $(command -v g++)"
          echo "gfortran: $(command -v gfortran) — $(gfortran --version | head -1)"
          echo "cmake:  $(command -v cmake) — $(cmake --version | head -1)"
          echo "make:   $(command -v make)"
          echo "qmake:  $(command -v qmake) — $(qmake --version 2>&1 | head -2)"
          echo "osslsigncode: $(command -v osslsigncode)"
          echo "nsis (makensis): $(command -v makensis)"
          echo
          echo "=== /mingw32 layout ==="
          ls /mingw32/bin | head -30
          echo "…"
          echo "=== Qt5 cmake config ==="
          find /mingw32 -name 'Qt5Config.cmake' 2>/dev/null | head -3 || true

      - name: Cache pFUnit
        id: pfunit-cache
        uses: actions/cache@v5
        with:
          path: pfunit-prefix
          key: pfunit-windows-x86-jtsdk-v4.9.0-${{ hashFiles('.github/workflows/build-windows-x86.yml') }}

      - name: Build pFUnit
        if: steps.pfunit-cache.outputs.cache-hit != 'true'
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          git clone --depth 1 --branch v4.9.0 --recursive \
            https://github.com/Goddard-Fortran-Ecosystem/pFUnit.git pfunit-src
          cmake -S pfunit-src -B pfunit-build -G "MSYS Makefiles" \
            -DSKIP_MPI=YES \
            -DSKIP_OPENMP=YES \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="${WORKSPACE}/pfunit-prefix"
          cmake --build pfunit-build -j$(nproc)
          cmake --install pfunit-build

      - name: Locate pFUnit config
        id: pfunit
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          for pkg in PFUNIT GFTL GFTL_SHARED FARGPARSE; do
            CONFIG=$(find "${WORKSPACE}/pfunit-prefix" -name ${pkg}Config.cmake | head -1)
            if [ -z "$CONFIG" ]; then
              echo "ERROR: ${pkg}Config.cmake not found under pfunit-prefix"
              find "${WORKSPACE}/pfunit-prefix" -maxdepth 3 -type d
              exit 1
            fi
            DIR="$(dirname "$CONFIG")"
            echo "Found ${pkg}Config.cmake at: $CONFIG"
            echo "$(echo $pkg | tr '[:upper:]' '[:lower:]')_dir=${DIR}" >> "$GITHUB_OUTPUT"
          done

      - name: Cache Hamlib
        id: hamlib-cache
        uses: actions/cache@v5
        with:
          path: hamlib-prefix
          key: hamlib-windows-x86-jtsdk-${{ inputs.hamlib_branch }}-${{ hashFiles('.github/workflows/build-windows-x86.yml') }}

      - name: Build Hamlib
        if: steps.hamlib-cache.outputs.cache-hit != 'true'
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          # JTSDK 3.3.1-x86 ships pkgconf 0.29.1; Hamlib's configure.ac
          # demands pkg.m4 >= 0.29.2. Drop the 0.29.2 macro from
          # upstream pkg-config into the aclocal include dir so
          # autoreconf's PKG_PROG_PKG_CONFIG macro version check passes.
          ACLOCAL_DIR=$(aclocal --print-ac-dir)
          if [ -f "${ACLOCAL_DIR}/pkg.m4" ]; then
            CURRENT=$(grep -oE 'pkg_major_version=[0-9]+|pkg_minor_version=[0-9]+' "${ACLOCAL_DIR}/pkg.m4" | paste -sd. - | sed 's/pkg_major_version=//;s/pkg_minor_version=//')
            echo "Existing pkg.m4 at ${ACLOCAL_DIR}: ${CURRENT:-unknown}"
          fi
          curl -fsSL -o "${ACLOCAL_DIR}/pkg.m4" \
            https://gitlab.freedesktop.org/pkg-config/pkg-config/-/raw/pkg-config-0.29.2/pkg.m4
          echo "Updated pkg.m4 to 0.29.2 at ${ACLOCAL_DIR}/pkg.m4"
          git clone --depth 1 --branch "${{ inputs.hamlib_branch }}" \
            https://github.com/Hamlib/Hamlib.git hamlib-src
          cd hamlib-src
          ./bootstrap
          ./configure \
            --prefix="${WORKSPACE}/hamlib-prefix" \
            --enable-shared --disable-static \
            --without-cxx-binding \
            --without-readline \
            CFLAGS="-DNDEBUG -g -O2 -fdata-sections -ffunction-sections" \
            LDFLAGS="-Wl,--gc-sections"
          make -j$(nproc)
          make install-strip

      - name: Install OmniRig
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.dxatlas.com/OmniRig/Files/OmniRig.zip" -OutFile OmniRig.zip
          Expand-Archive -Path OmniRig.zip -DestinationPath omnirig-extract
          $setup = Get-ChildItem -Path omnirig-extract -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $setup) { throw "No installer found in OmniRig.zip" }
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/NORESTART' -Wait
          $omnirig = Get-ChildItem -Path "C:\Program Files*\Afreet\OmniRig" -Filter "OmniRig.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $omnirig) { throw "OmniRig install failed — OmniRig.exe not found" }
          echo "OMNIRIG_PATH=$($omnirig.FullName)" >> $env:GITHUB_ENV

      - name: Fix dumpcpp name (JTSDK ships dumpcpp-qt5, CMake expects dumpcpp)
        run: |
          if [ -f /mingw32/bin/dumpcpp-qt5.exe ] && [ ! -f /mingw32/bin/dumpcpp.exe ]; then
            ln -sf /mingw32/bin/dumpcpp-qt5.exe /mingw32/bin/dumpcpp.exe
          fi

      - name: Configure
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          OMNIRIG=$(cygpath "${OMNIRIG_PATH}")
          cmake -G "MSYS Makefiles" -S . -B wsjtx-build \
            -DCMAKE_PREFIX_PATH="${WORKSPACE}/hamlib-prefix" \
            -DOMNIRIG_TYPE_LIB="${OMNIRIG}" \
            -DWSJT_SKIP_MAP65=ON \
            -DCMAKE_Fortran_FLAGS="-fallow-argument-mismatch -std=legacy" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DWSJT_GENERATE_DOCS=OFF \
            -DWSJT_SKIP_MANPAGES=ON \
            -DWSJT_BUILD_TESTS=ON \
            -DPFUNIT_DIR="${{ steps.pfunit.outputs.pfunit_dir }}" \
            -DGFTL_DIR="${{ steps.pfunit.outputs.gftl_dir }}" \
            -DGFTL_SHARED_DIR="${{ steps.pfunit.outputs.gftl_shared_dir }}" \
            -DFARGPARSE_DIR="${{ steps.pfunit.outputs.fargparse_dir }}" \
            -Wno-dev

      - name: Build
        run: cmake --build wsjtx-build -j$(nproc)

      - name: Run tests
        id: ctest
        run: ctest --output-on-failure --output-junit ctest-results.xml
        working-directory: wsjtx-build

      - name: Publish test summary
        if: always() && steps.ctest.conclusion != 'skipped'
        working-directory: wsjtx-build
        run: python3 ../.github/scripts/publish-ctest-summary.py "Windows x86" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always() && steps.ctest.conclusion != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: ctest-results-windows-x86
          path: wsjtx-build/ctest-results.xml
          if-no-files-found: ignore

      - name: Verify binary
        run: |
          file wsjtx-build/jt9.exe
          file wsjtx-build/jt9.exe | grep -q "80386"

      - name: Package NSIS installer
        run: |
          cd wsjtx-build
          cpack -G NSIS -V \
            -D CPACK_PACKAGE_VERSION="${{ inputs.version }}" \
            -D CPACK_PACKAGE_FILE_NAME="wsjtx-${{ inputs.version }}-win32"
          ls -la *.exe

      - name: Sign installer with self-signed sandbox cert
        run: |
          cd wsjtx-build
          INSTALLER=$(ls wsjtx-${{ inputs.version }}-*.exe | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "ERROR: no NSIS installer produced by cpack"
            ls -la
            exit 1
          fi
          echo "Unsigned installer: $INSTALLER"
          MSYS2_ARG_CONV_EXCL="*" openssl req -x509 -newkey rsa:2048 \
            -keyout sandbox-key.pem -out sandbox-cert.pem \
            -days 365 -nodes \
            -subj "/CN=WSJT-X Sandbox Dev Signing/O=KJ5HST-LABS/C=US"
          SIGNED="${INSTALLER%.exe}-signed.exe"
          osslsigncode sign \
            -certs sandbox-cert.pem -key sandbox-key.pem \
            -n "WSJT-X Sandbox Installer" \
            -i "https://github.com/KJ5HST-LABS/wsjtx-internal" \
            -h sha256 \
            -in "$INSTALLER" -out "$SIGNED"
          mv "$SIGNED" "$INSTALLER"
          rm -f sandbox-key.pem sandbox-cert.pem
          echo "Signed installer: $INSTALLER"
          osslsigncode verify "$INSTALLER" || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: wsjtx-${{ inputs.version }}-windows-x86-installer
          path: wsjtx-build/wsjtx-${{ inputs.version }}-win32.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wsjtx-${{ inputs.version }}-windows-x86
          path: |
            wsjtx-build/jt9.exe
            wsjtx-build/wsprd.exe
            wsjtx-build/wsjtx.exe
